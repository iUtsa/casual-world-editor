name: Feature or experiment idea
description: A new “what if”, lab, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should be possible, and who is it for (a student, a teacher, a demo)?
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How would we check it?
      description: The textbook formula, law or measurement that tells us the result is right.
